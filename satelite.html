<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventana Satélite</title>
</head>

<body>
    <h1>Ventana Satélite</h1>
    <p id="bienvenida"></p>

    <button onclick="redirigirConHistorial()">Redirigir con Historial</button>
    <button onclick="redirigirSinHistorial()">Redirigir sin Historial</button>

    <hr>

    <button onclick="iniciarAutodestruccion()">Autodestrucción en 5 segundos</button>
    <p id="mensaje-autodestruccion"></p>

    <script>
        
        const userAgent = window.navigator.userAgent.toLowerCase();
        let sistemaOperativo = 'un sistema operativo no identificado';

        if (userAgent.indexOf('windows') >= 0) {
            sistemaOperativo = 'Windows';
        } else if (userAgent.indexOf('mac') >= 0) {
            sistemaOperativo = 'Mac';
        } else if (userAgent.indexOf('linux') >= 0) {
            sistemaOperativo = 'Linux';
        }

        const cajaBienvenida = document.getElementById("bienvenida");
        cajaBienvenida.innerHTML = "¡Bienvenido/a! Estás navegando desde " + sistemaOperativo + ".";

        function redirigirConHistorial() {
            if (window.opener) {

                window.opener.location.assign("https://www.ilerna.es/fp-sevilla/");
            }
        }

        function redirigirSinHistorial() {
            if (window.opener) {
                window.opener.location.replace("https://www.ilerna.es/fp-sevilla/");
            }
        }

        function iniciarAutodestruccion() {
            const cajaMensaje = document.getElementById("mensaje-autodestruccion");
            cajaMensaje.innerHTML = "Esta ventana se cerrará automáticamente en 5 segundos...";

            setTimeout(function () {
                window.close();
            }, 5000);
        }
    </script>
</body>

</html>
